version: 1
image: node:24-bookworm
setup: [ npm ci ]
verify:
  build: npm run build
  test: npm test
environments:
  staging:
    setup: [ npm ci, npm run build ]
    start: npm run preview -- --host 0.0.0.0 --port 4173
    port: 4173
    ready: { http: / }
capabilities_dir: docs/product/capabilities
egress_allow:
  - clients2.google.com
  - redirector.gvt1.com
  - accounts.google.com
  - www.google.com
  - update.googleapis.com
